# EPI demo stack. Ports bind to localhost by default; exposing them on a network needs approval.
name: epi
services:
  postgres:
    image: ${EPI_POSTGRES_IMAGE:-docker.io/library/postgres:16-alpine}
    pull_policy: ${EPI_PULL_POLICY:-missing}
    restart: unless-stopped
    environment:
      POSTGRES_USER: epi
      POSTGRES_DB: epi
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      - epi-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U epi -d epi']
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { memory: 1g }

  epi:
    image: ${EPI_IMAGE:-epi:local}
    pull_policy: never
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      EPI_MODE: ${EPI_MODE:-demo}
      EPI_COOKIE_SECURE: ${EPI_COOKIE_SECURE:-false}
      EPI_DB_PASSWORD_FILE: /run/secrets/db_password
      EPI_DB_HOST: postgres
      # Jira/GitLab tokens, one file per reference (./epi.sh source-token EPI_JIRA_TOKEN).
      EPI_SOURCE_SECRETS_DIR: /run/epi-sources
      # Company CA for Jira/GitLab over https (./epi.sh source-ca; empty file = public CAs only).
      NODE_EXTRA_CA_CERTS: /run/epi-sources/ca.pem
    secrets: [db_password]
    volumes:
      - ${EPI_STATE_DIR:-../.epi}/sources:/run/epi-sources:ro
    ports:
      - '${EPI_BIND:-127.0.0.1}:${EPI_PORT:-8080}:8080'
    deploy:
      resources:
        limits: { memory: 768m }

secrets:
  db_password:
    file: ${EPI_DB_PASSWORD_PATH:?EPI_DB_PASSWORD_PATH must point to a secret file}

volumes:
  epi-db:
